kind: Deployment
apiVersion: apps/v1

metadata:
  name: cloudops-dep
  namespace: cloudops
  labels:
    name: cloudops

spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudops
  template:
    metadata:
      labels:
        app: cloudops

    spec:
      containers:
      - name: cloudops
        image: rayyan12311/cloudops-java-taskhub:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/tasks
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
