name: Master CI - Java CloudOps

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  gitleak-scan:
    name: 1. Secret Scan
    uses: ./.github/workflows/gitleak-scan.yml

  linting:
    name: 2. Linting
    needs: gitleak-scan
    uses: ./.github/workflows/lint.yml

  codeql-analysis:
    name: 3. CodeQL Analysis
    needs: linting
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/code-quality.yml

  snyk-scan:
    name: 4. Snyk SCA Scan
    needs: linting
    uses: ./.github/workflows/sca.yml
    secrets: inherit

  sonarqube-analysis:
    name: 5. SonarQube Analysis
    needs: linting
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit

  hadolint:
    name: Hadolint
    needs: linting
    uses: ./.github/workflows/hadolint.yml

  docker-build-scan-push:
    name: 6. Docker Build, Scan & Push
    needs:
      - codeql-analysis
      - hadolint
      - snyk-scan
      - sonarqube-analysis
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit