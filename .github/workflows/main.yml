name: Master Ci-java-cloudops workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  gitleak-scan:
    name: 1. Secret Scan
    uses: ./.github/workflows/gitleak-scan.yml

  linting:
    name: 2. Linting
    needs: gitleak-scan
    uses: ./.github/workflows/lint.yml

  codeql-analysis:
    name: 3. CodeQL Analysis
    needs: linting
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/code-quality.yml

  snyk-scan:
    name: 4. Snyk SCA Scan
    needs: codeql-analysis
    uses: ./.github/workflows/sca.yml
    secrets: inherit

  sonarqube-analysis:
    name: 5. SonarQube Analysis
    needs: snyk-scan
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit

  docker-build-scan-push:
    name: 5. Docker Build, Scan, and Push
    needs: [gitleak-scan,linting,codeql-analysis,sonarqube-analysis,snyk-scan]
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit