name: Gitleaks

on:
  workflow_call:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gacts/gitleaks@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
